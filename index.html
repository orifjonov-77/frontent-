<!doctype html>
<html lang="uz" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDev — Online Ta'lim Platformasi</title>
  <meta name="description"
    content="Professional IT ko'nikmalarni o'rganing: dasturlash, kompyuter savodxonligi, video montaj. Video darslar, testlar va interaktiv vazifalar." />
  <meta name="theme-color" content="#6366f1" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MDev" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Font preload for faster rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" />

  <!-- Preconnect to API -->
  <link rel="preconnect" href="https://teachingback.onrender.com" />
  <link rel="dns-prefetch" href="https://teachingback.onrender.com" />

  <!-- Inline loading screen styles for instant display -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    @media (prefers-color-scheme: dark) {
      #app-loader {
        background: #0b0f1a;
      }

      #app-loader .loader-text {
        color: #f1f5f9;
      }

      #app-loader .loader-dot {
        background: #818cf8;
      }
    }

    #app-loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-loader .loader-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: contain;
      animation: loaderPulse 1.8s ease-in-out infinite;
      margin-bottom: 1.25rem;
    }

    #app-loader .loader-text {
      font-family: 'Inter', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    #app-loader .loader-dots {
      display: flex;
      gap: 6px;
      margin-top: 1rem;
    }

    #app-loader .loader-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366f1;
      animation: loaderBounce 1.2s ease-in-out infinite;
    }

    #app-loader .loader-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    #app-loader .loader-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes loaderPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.85;
      }
    }

    @keyframes loaderBounce {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <!-- Branded loading screen -->
  <div id="app-loader">
    <img src="/logo.png" alt="MDev" class="loader-logo" />
    <span class="loader-text">MDev...</span>
    <div class="loader-dots">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { });
      });
    }
  </script>
</body>

</html>
