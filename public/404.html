<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MDev Academy</title>
    <script>
        // SPA fallback — redirect 404 to index.html with path preserved
        // This handles page refresh on client-side routes
        var path = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/' + '?redirect=' + encodeURIComponent(path));
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
